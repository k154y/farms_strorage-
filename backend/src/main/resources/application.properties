spring.config.import=optional:file:.env[.properties]
spring.application.name=agri-storage-system

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=mySecretKey123456789
app.jwt.expiration-ms=86400000
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.auth.verification-expiration-minutes=${AUTH_VERIFICATION_EXPIRATION_MINUTES:1440}
app.auth.reset-expiration-minutes=${AUTH_RESET_EXPIRATION_MINUTES:30}

